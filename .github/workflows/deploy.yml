name: Publier le site sur GitHub Pages

on:
  push:
    branches: [claude/eager-gates-7m1151]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Construire le site
        run: npm run build
        env:
          # Variables de dépôt facultatives (Settings → Secrets and variables → Actions) :
          # SITE_URL et BASE_PATH pour un domaine propre (BASE_PATH « / »).
          SITE_URL: ${{ vars.SITE_URL || 'https://ayoubhassani91.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/-Si-' }}
          PUBLIC_WEB3FORMS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
